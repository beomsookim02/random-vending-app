workflows:
  ios-build:
    name: Anything Vending iOS Build
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.beomsookim.anythingvending
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Enforce iPhone app icon configuration
        script: |
          # This app is iPhone-only. Capacitor/Xcode project defaults may include iPad.
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' ios/App/App.xcodeproj/project.pbxproj

          # Ensure the final plist used by the archive explicitly points to AppIcon.
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconName" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" ios/App/App/Info.plist

          ICON_PATH="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png.png"

          # Fail early if the expected AppIcon asset is not present.
          test -f ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json
          grep -q 'AppIcon-512@2x.png.png' ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json
          test -f "$ICON_PATH"

          # The source icon is larger than Apple's required 1024x1024 App Store icon.
          # Resize it in-place before Xcode compiles the asset catalog.
          sips -z 1024 1024 "$ICON_PATH" --out "$ICON_PATH"

          # Verify the resized dimensions before archiving.
          WIDTH=$(sips -g pixelWidth "$ICON_PATH" | awk '/pixelWidth/ {print $2}')
          HEIGHT=$(sips -g pixelHeight "$ICON_PATH" | awk '/pixelHeight/ {print $2}')
          test "$WIDTH" = "1024"
          test "$HEIGHT" = "1024"

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Set build number
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
